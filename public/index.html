<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forx Gamez</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Forx Gamez</h1>
<div id="roomBox">

<button id="createRoom">
Create Room
</button>

<input
id="roomInput"
placeholder="Room ID">

<button id="joinRoom">
Join Room
</button>

<div id="roomIdText"></div>

</div>
<div class="credit">
5x5 TicTacToe Activity
</div>

<div id="turn">
Turn: X
</div>

<div id="board" class="board"></div>

<div id="winner"></div>

<button id="restart">
Restart Game
</button>

</div>
<script src="/socket.io/socket.io.js"></script>

<script src="game.js"></script>

</body>
</html>
